[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ownsearch"
version = "2.0.0"
description = "Independent query-time web crawling and memory-only search"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
text = ["regex>=2024.11.6,<2027", "stopwordsiso==0.7.1", "dateparser>=1.2,<2", "holidays>=0.60,<1", "charset-normalizer>=3.4,<4"]

[project.scripts]
ownsearch = "ownsearch.cli:main"

[tool.setuptools.packages.find]
include = ["ownsearch*"]

[tool.setuptools.package-data]
ownsearch = ["resources/*.txt", "resources/*.tsv", "resources/*.json", "resources/*.html"]
